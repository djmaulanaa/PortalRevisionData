<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Dispatcher</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen flex flex-col bg-gradient-to-br from-blue-900 via-slate-800 to-slate-900">

    <!-- CENTER CONTENT -->
    <div class="flex-1 flex items-center justify-center">

        <div class="w-full max-w-md px-6">

            <div class="bg-white/95 backdrop-blur-lg rounded-2xl shadow-2xl p-8">

                <!-- Logo -->
                <div class="flex justify-center mb-5">
                    <div class="w-16 h-16 bg-blue-600 rounded-full flex items-center justify-center text-white text-2xl font-bold shadow-lg">
                        D
                    </div>
                </div>

                <!-- Title -->
                <div class="text-center mb-8">
                    <h1 class="text-3xl font-bold text-gray-800">
                        Dispatcher Login
                    </h1>
                    <p class="text-sm text-gray-500 mt-2">
                        Sign in to continue
                    </p>
                </div>

                <!-- SN -->
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-600 mb-2">
                        Service Number
                    </label>

                    <div class="relative">
                        <span class="absolute left-3 top-3 text-gray-400">
                            👤
                        </span>

                        <input
                            id="sn"
                            type="text"
                            placeholder="Enter your SN"
                            class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
                    </div>
                </div>

                <!-- Password -->
                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-600 mb-2">
                        Password
                    </label>

                    <div class="relative">
                        <span class="absolute left-3 top-3 text-gray-400">
                            🔒
                        </span>

                        <input
                            id="password"
                            type="password"
                            placeholder="Enter your password"
                            class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
                    </div>
                </div>

                <!-- Login Button -->
                <button
                    id="loginBtn"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl transition duration-300 shadow-lg hover:shadow-xl">
                    Login
                </button>

                <!-- Small Footer inside card -->
                <!-- <div class="mt-6 text-center text-xs text-gray-400">
                    Dispatcher Management System
                </div> -->

            </div>

        </div>

    </div>

    <!-- GLOBAL FOOTER -->
    <footer class="p-4">

        <div class="max-w-md mx-auto">

            <div class="text-center text-slate-300">

                <p class="font-semibold">
                    PT Cipta Kridatama - Site BIB
                </p>

                <p class="text-sm text-slate-400 mt-1">
                    Productivity Monitoring & Revision Management System
                </p>

                <p class="text-xs text-slate-500 mt-3">
                    © 2026 Operational Monitoring & Control System. All rights reserved.
                </p>

            </div>

        </div>

    </footer>

    <script src="login.js"></script>

</body>
</html>
